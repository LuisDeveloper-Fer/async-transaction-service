server {
 listen 8080;
 server_name _;
 root /usr/share/nginx/html;
 add_header X-Content-Type-Options nosniff;
 add_header X-Frame-Options DENY;
 location / { try_files $uri $uri/ /index.html; }
 location /api/ { proxy_pass http://api:8080; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
}
